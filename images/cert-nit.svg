<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="nitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7fa" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b60" />
      <stop offset="100%" stop-color="#185a9d" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#nitBg)" rx="12"/>
  
  <!-- Ornate Border -->
  <rect x="25" y="25" width="950" height="650" rx="8" fill="none" stroke="#0b3b60" stroke-width="4" />
  <rect x="35" y="35" width="930" height="630" rx="6" fill="none" stroke="#0b3b60" stroke-width="1.5" stroke-dasharray="8,4" />
  <rect x="42" y="42" width="916" height="616" rx="4" fill="none" stroke="#d4af37" stroke-width="1.5" />

  <!-- NIT Header -->
  <g transform="translate(120, 65)">
    <!-- Logo Badge Placeholder -->
    <circle cx="50" cy="50" r="42" fill="#0b3b60" stroke="#d4af37" stroke-width="3"/>
    <text x="50" y="58" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">NITT</text>
  </g>
  
  <text x="520" y="95" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#0b3b60" text-anchor="middle" letter-spacing="1">NATIONAL INSTITUTE OF TECHNOLOGY</text>
  <text x="520" y="130" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#0b3b60" text-anchor="middle" letter-spacing="2">TIRUCHIRAPPALLI</text>
  <text x="520" y="155" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#556b82" text-anchor="middle">Tiruchirappalli - 620015, Tamil Nadu, India</text>
  
  <!-- Ribbon / Certificate Title -->
  <text x="500" y="225" font-family="'Inter', serif" font-size="34" font-weight="700" fill="#b82e24" text-anchor="middle" font-style="italic">Certificate of Internship</text>
  <text x="500" y="270" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#445566" text-anchor="middle">This internship certificate is proudly awarded to</text>
  
  <!-- Candidate Name -->
  <text x="500" y="325" font-family="'Inter', sans-serif" font-size="38" font-weight="800" fill="#b82e24" text-anchor="middle">Ponnada Syam Ayyappa</text>
  <text x="500" y="360" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#0b3b60" text-anchor="middle">Sasi Institute of Technology and Engineering</text>
  
  <!-- Body text -->
  <text x="500" y="410" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#334455" text-anchor="middle">
    For the outstanding completion of summer internship at <tspan font-weight="700" fill="#0b3b60">NIT Tiruchirappalli</tspan> with a prime
  </text>
  <text x="500" y="440" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#b82e24" text-anchor="middle">
    focus on Cloud Computing &amp; DevOps
  </text>
  <text x="500" y="470" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#334455" text-anchor="middle">
    under guidance from <tspan font-weight="700">May 18 to July 18, 2026</tspan>.
  </text>
  
  <!-- Signatures -->
  <line x1="380" y1="585" x2="620" y2="585" stroke="#0b3b60" stroke-width="1.5" />
  <text x="500" y="610" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#0b3b60" text-anchor="middle">Dr. Vinay Raj</text>
  <text x="500" y="632" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#556b82" text-anchor="middle">Assistant Professor • Dept of Computer Applications, NIT Trichy</text>
</svg>
