  <text x="560" y="485" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#aab2bf">VERIFICATION</text>
  <text x="560" y="515" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ff9900">credly.com/go/Kqy90cVl</text>
  <text x="350" y="555" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#36d399">✓ Verified Digital Credential</text>
  
  <!-- Decorative Badge Icon -->
