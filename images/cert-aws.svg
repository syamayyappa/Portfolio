      <stop offset="0%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#182030" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Geometric Hexagon Pattern -->
  <g stroke="rgba(255,153,0,0.15)" stroke-width="2" fill="none">
    <polygon points="120,80 180,45 240,80 240,150 180,185 120,150" />
    <polygon points="60,185 120,150 180,185 180,255 120,290 60,255" />
    <polygon points="120,290 180,255 240,290 240,360 180,395 120,360" />
    <polygon points="60,395 120,360 180,395 180,465 120,500 60,465" />
    <polygon points="120,500 180,465 240,500 240,570 180,605 120,570" />
  </g>

  <!-- Border -->
  <rect x="25" y="25" width="950" height="650" rx="12" fill="none" stroke="rgba(255,153,0,0.3)" stroke-width="2" />
  <rect x="35" y="35" width="930" height="630" rx="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  
  <!-- AWS Academy Header -->
