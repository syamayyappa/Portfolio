  <!-- Certificate Title -->
  <text x="320" y="270" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Syam ayyappa ponnada</text>
  
  <text x="320" y="325" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#ffb84d">Certificate of Completion for</text>
  <text x="320" y="365" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff">AWS Academy Graduate - Cloud Foundations</text>
  <text x="320" y="398" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#aab2bf">Training Badge • 20 Course Hours Completed</text>
  
  <!-- Details Box -->
